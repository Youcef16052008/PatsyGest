name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Application · tests, types, lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: patisgest-app
    # La suite inclut les courses concurrentes testées sur un PostgreSQL réel.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PATSYGEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      # Comprend les tests PGlite et ceux de concurrence; aucun ne certifie le pilote.
      - run: npm test
      - name: Build sans accès ni secrets de production
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65531
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      - name: Tests du design studio
        working-directory: .
        run: node --test design-studio/tests/*.test.mjs

  isolated-integration:
    name: Auth et PostgREST isolés · ${{ matrix.schema }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        schema: [historique, vitrine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.75.0
      - run: npm ci
        working-directory: patisgest-app
      - name: Démarrer une pile locale jetable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patsygest-ci"
          cd "$RUNNER_TEMP/patsygest-ci"
          supabase init
          supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,inbucket
          umask 077
          supabase status -o env > "$RUNNER_TEMP/supabase-test.env"
      - name: Tests de rôles avec Auth et PostgREST locaux
        shell: bash
        working-directory: patisgest-app
        env:
          PATSYGEST_TEST_VITRINE: ${{ matrix.schema == 'vitrine' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/supabase-test.env"
          set +a
          export PATSYGEST_DISPOSABLE=yes
          node --test tests/integration/auth-postgrest.mjs
      - name: Détruire la pile locale
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/patsygest-ci" 2>/dev/null || exit 0
          supabase stop --no-backup

  parcours-e2e:
    name: Parcours Playwright · ${{ matrix.spec }}
    # DÉCLENCHEMENT MANUEL UNIQUEMENT — et ce n'est pas un oubli.
    #
    # Les 4 parcours (`tests/e2e/*.spec.mjs`) exigent TOUT ce qui suit, que ce
    # workflow ne fournit pas :
    #   1. une pile Supabase réelle (Auth + PostgREST) : le build de `quality`
    #      pointe sur 127.0.0.1:65531, une adresse morte par construction ;
    #   2. la chaîne de migrations appliquée à cette base (tables `articles`,
    #      `lots`, `ventes`…) ;
    #   3. `seed.mjs` (Baba au rhum, lot, vitrine publiée) ;
    #   4. un utilisateur Auth réel : `connecter()` fait un vrai mot de passe
    #      sur /connexion puis attend `**/tableau-de-bord` ;
    #   5. l'application servie par `next start` avec l'URL de CETTE pile.
    #
    # Les déclencher sur `main` échouerait à coup sûr. Pour les automatiser,
    # les brancher sur la pile jetable de `supabase-isole.yml` (qui a déjà
    # 1., 2. et 3. et exporte `$RUNNER_TEMP/supabase-test.env`), sans quoi la
    # porte reste fermée. L'étape « Préconditions » ci-dessous refuse de
    # démarrer si la pile n'est pas là, au lieu d'échouer sur un timeout obscur.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        spec: [caisse, stock, transfert, vitrine]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PATSYGEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      PATSYGEST_E2E_BASE: http://127.0.0.1:3416
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - run: npm ci
        working-directory: patisgest-app
      - name: Installer Chromium
        working-directory: patisgest-app
        run: npx playwright install --with-deps chromium
      - name: Préconditions (pile Supabase + chaîne + seed)
        working-directory: patisgest-app
        run: |
          set -euo pipefail
          echec=0
          if [ "${NEXT_PUBLIC_SUPABASE_URL}" = "http://127.0.0.1:65531" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL pointe sur l'adresse factice de la CI : brancher une vraie pile Supabase avant de lancer ce job."
            echec=1
          fi
          if ! command -v psql > /dev/null 2>&1; then
            echo "::error::psql absent : impossible de vérifier le schéma ni de seeder."
            echec=1
          elif ! psql "$PATSYGEST_PG_URL" -tAc "select to_regclass('public.articles') is not null" | grep -q t; then
            echo "::error::La chaîne de migrations n'est pas appliquée (table articles absente). Ce job ne l'applique pas."
            echec=1
          fi
          if [ "$echec" -ne 0 ]; then
            echo "::notice::Voir le commentaire du job parcours-e2e : les 5 prérequis y sont listés."
            exit 1
          fi
          echo "Préconditions satisfaites."
      - name: Construire l'application
        working-directory: patisgest-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65531
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test
        run: npm run build
      - name: Démarrer l'application
        working-directory: patisgest-app
        run: |
          set -euo pipefail
          nohup npm run start -- -p 3416 > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$PATSYGEST_E2E_BASE/api/health" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::L'application n'a pas répondu sur $PATSYGEST_E2E_BASE après 120 s"
          tail -50 "$RUNNER_TEMP/app.log"
          exit 1
      - name: Parcours ${{ matrix.spec }}
        working-directory: patisgest-app
        run: node --test "tests/e2e/${{ matrix.spec }}.spec.mjs"
      - name: Journal de l'application
        if: failure()
        run: tail -100 "$RUNNER_TEMP/app.log"
