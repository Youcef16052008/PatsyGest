name: Certification production · pile réelle

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL de production à certifier'
        required: false
        type: string
        default: 'https://patsy-gest.vercel.app'

permissions:
  contents: read

concurrency:
  group: certification-production-${{ github.ref }}
  cancel-in-progress: false

# Le secret SUPABASE_DB_URL existant est périmé (authentification refusée). La
# concurrence PostgreSQL réelle est certifiée par le service PostgreSQL 17 et par
# le rejeu 01→57 sur le pilote via le connecteur Supabase, sans modifier de
# secret (décision `secrets=existing`). La pile hébergée est certifiée par la
# sonde /api/health/stack de Vercel, qui utilise ses propres variables.

jobs:
  contrats-ocr:
    if: github.event_name == 'workflow_dispatch'
    name: Contrats OCR, chaîne SQL, types et lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: patisgest-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:cert:ocr

  postgres-reel:
    if: github.event_name == 'workflow_dispatch'
    name: Concurrence sur PostgreSQL 17 réel (chaîne 01→57)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: patisgest-app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PATSYGEST_PG_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - run: npm ci
      - name: Chaîne SQL et transferts concurrents sur PostgreSQL réel
        run: npm run test:cert:postgresql
      - name: Rendez-vous de deux connexions PostgreSQL réelles
        run: npm run test:cert:concurrency

  pile-hebergee:
    if: github.event_name == 'workflow_dispatch'
    name: Auth · PostgREST · Storage · Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patisgest-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CERT_BASE_URL: ${{ inputs.base_url || 'https://patsy-gest.vercel.app' }}
      CERT_EXPECTED_SCHEMA_VERSION: '57'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: patisgest-app/package-lock.json
      - run: npm ci
      - run: npm run test:cert:hosted
