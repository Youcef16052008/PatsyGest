name: Sauvegarde Supabase + garde-veille

# COPIE PARTIELLE NON CERTIFIÉE, PAS UN PLAN DE REPRISE.
# Le dump PostgreSQL conserve les ACL et les propriétaires mais leur restauration
# n'est pas démontrée. Il ne couvre pas les fichiers Storage, les rôles globaux,
# ni les réglages des services. Ne pas utiliser comme condition suffisante
# d'application des migrations ; cf. patisgest-app/migrations/ETAT-RESTAURATION.md.
# SUPABASE_DB_URL et BACKUP_PASSPHRASE sont nécessaires dans GitHub Actions.

on:
  schedule:
    # 02:15 UTC = 03:15 à Oran (pas de changement d'heure en Algérie)
    - cron: "15 2 * * *"
    # Garde-veille seul, tous les 2 jours, en cas d'échec du dump
    - cron: "15 7 */2 * *"
  workflow_dispatch:

concurrency:
  group: sauvegarde-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: config
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ github.event.schedule }}" = '15 7 */2 * *' ]; then
            echo "dump=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL absent : aucune sauvegarde possible."
            exit 1
          else
            echo "dump=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------- garde-veille
      # Une requête REST suffit à réarmer le compteur d'inactivité (7 jours).
      # On passe par l'API publique : plus simple qu'un client psql, et cela
      # teste au passage que l'application répond.
      - name: Garde-veille (sonde non garantie contre la mise en pause)
        if: always() && (steps.config.outputs.dump == 'false' || steps.config.outcome == 'failure')
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY absents — garde-veille ignoré."
            exit 0
          fi
          # /auth/v1/health est public, sans jeton, et réveille PostgREST.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/auth/v1/health")
          echo "Santé Supabase : HTTP $code"
          # Une table RLS refusée renvoie 401/403 : c'est une requête valide
          # du point de vue de l'activité, le projet n'est donc pas en pause.
          code2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/articles?select=id&limit=1")
          echo "PostgREST : HTTP $code2 (401 attendu : anon ne lit rien, par conception)"
          if [ "$code" -ge 500 ] 2>/dev/null; then
            echo "::error::Le projet ne répond pas (HTTP $code). Vérifier s'il est en pause."
            exit 1
          fi

      # --------------------------------------------------------- pg_dump
      - name: Copie partielle chiffrée (AES-256-GCM, étiquette vérifiée)
        id: backup
        if: steps.config.outputs.dump == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_PASSPHRASE absent ou trop court — aucune sauvegarde."
            exit 1
          fi
          set -euo pipefail
          umask 077
          # Revue B-011 : AES-CBC sans étiquette remplacé par le coffre GCM du dépôt.
          # Le dump clair ne va jamais sur le disque du runner : tmpfs (/dev/shm) seulement,
          # effacé à la sortie du step, même en cas d'échec.
          clair=""; relu=""
          trap 'rm -f "$clair" "$relu"' EXIT
          clair=$(mktemp -p /dev/shm patisgest-clair.XXXXXX)
          export PGDATABASE="$DB_URL"
          horodatage=$(date -u +%Y-%m-%dT%H%M%SZ)
          fichier="patisgest-$horodatage.dump.gz.gcm"
          echo "::group::Diagnostic connexion (valeurs jamais affichees)"
          echo "DB_URL defini : ${#DB_URL} caracteres"
          echo "PGDATABASE defini : ${#PGDATABASE} caracteres"
          echo "::endgroup"
          # L'URL de connexion se passe à `--dbname` : `PGDATABASE` n'est pour
          # pg_dump qu'un nom de base, pas une URI (sinon il retombe sur le
          # socket local /run/postgresql).
          docker run --rm -e PGDATABASE="$DB_URL" -e PGSSLMODE=require postgres:17-alpine \
            sh -c 'pg_dump --dbname="$PGDATABASE" -Fc --compress=0' | gzip -9 > "$clair"
          PATSYGEST_BACKUP_PASSPHRASE="$PASSPHRASE" \
            node patisgest-app/scripts/coffre-sauvegarde.mjs chiffrer "$clair" "$fichier"
          rm -f "$clair"
          taille=$(stat -c %s "$fichier" | numfmt --to=iec)
          echo "Sauvegarde : $fichier ($taille)"
          # Relecture complète du coffre : déchiffrement authentifié, puis lecture du dump sans exécuter le SQL.
          relu=$(mktemp -p /dev/shm patisgest-relu.XXXXXX)
          PATSYGEST_BACKUP_PASSPHRASE="$PASSPHRASE" \
            node patisgest-app/scripts/coffre-sauvegarde.mjs dechiffrer "$fichier" "$relu"
          # CONTENU, pas seulement lisibilité. `pg_restore --file=/dev/null`
          # ne prouve que la validité de l'archive : un projet Supabase en PAUSE
          # (ou une base vidée) produit un dump parfaitement lisible et …
          # absolument vide, qui était ensuite publié comme « sauvegarde
          # réussie ». C'est exactement le scénario « échec silencieux ».
          toc=$([ -n "$relu" ] && gzip -dc "$relu" | docker run --rm -i postgres:17-alpine pg_restore -l)
          rm -f "$relu"
          # Les tables du schéma public (hors tables du système/extensions).
          nb_tables=$(printf '%s\n' "$toc" | grep -cE '^[0-9]+; [0-9]+ [0-9]+ TABLE public ' || true)
          echo "Tables du schéma public dans le dump : $nb_tables"
          if [ "$nb_tables" -lt 10 ]; then
            echo "::error::Sauvegarde suspecte : $nb_tables table(s) public seulement. Le projet Supabase est peut-être en pause, ou la source est vide. Aucune sauvegarde n'est publiée."
            exit 1
          fi
          # Témoin : la table des utilisateurs prouve qu'on a bien dumpé la
          # base métier et non une base voisine.
          if ! printf '%s\n' "$toc" | grep -qE '^[0-9]+; [0-9]+ [0-9]+ TABLE public utilisateurs '; then
            echo "::error::Sauvegarde suspecte : table « utilisateurs » absente du dump. Source probablement incorrecte."
            exit 1
          fi
          echo "Contenu du dump vérifié ($nb_tables tables) ; ceci ne certifie pas une restauration."
          echo "FICHIER=$fichier" >> "$GITHUB_ENV"

      - name: Conserver la sauvegarde (artefact GitHub, 30 jours)
        if: steps.config.outputs.dump == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: ${{ env.FICHIER }}
          retention-days: 30
          if-no-files-found: error

      - name: Copier hors de GitHub (Cloudflare R2)
        if: steps.config.outputs.dump == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::R2 non configuré — la sauvegarde reste en artefact GitHub."
            exit 0
          fi
          pipx install awscli >/dev/null 2>&1 || pip install --quiet awscli
          aws s3 cp "$FICHIER" "s3://$R2_BUCKET/sauvegardes/$FICHIER" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Copie R2 terminée."

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Copie partielle PâtisGest — restauration non certifiée"
            echo ""
            echo "- Étape de sonde : ${{ steps.health.outcome }} (les secrets peuvent manquer)."
            echo "- Copie partielle : ${{ steps.backup.outcome }}."
            echo "- Rôles globaux, services et fichiers Storage non couverts ; restauration des ACL et propriétaires non prouvée."
            echo "- Restauration réelle non testée par ce workflow."
            echo ""
            echo "**Essai limité**, uniquement sur une base de test isolée, non sur le pilote :"
            echo '```'
            echo 'PATSYGEST_BACKUP_PASSPHRASE=… node scripts/coffre-sauvegarde.mjs dechiffrer <fichier.gcm> d.gz'
            echo 'gunzip -c d.gz > d.pgc && pg_restore --exit-on-error -d "<base de test>" d.pgc'
            echo '# Anciennes copies (.dump.gz.enc, AES-CBC) : openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
