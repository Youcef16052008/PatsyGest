name: Sauvegarde Supabase + garde-veille

# COPIE PARTIELLE NON CERTIFIÉE, PAS UN PLAN DE REPRISE.
# Ce workflow historique ne couvre pas Storage, les ACL/propriétaires, les
# réglages des services ni les rôles et ne prouve pas une restauration. Ne pas
# l'utiliser comme condition suffisante d'application de migrations.
# SUPABASE_DB_URL et BACKUP_PASSPHRASE sont nécessaires dans GitHub Actions.
# Cf. patisgest-app/migrations/ETAT-RESTAURATION.md pour les contrôles manquants.

on:
  schedule:
    # 02:15 UTC = 03:15 à Oran (pas de changement d'heure en Algérie)
    - cron: "15 2 * * *"
    # Garde-veille seul, tous les 2 jours, en cas d'échec du dump
    - cron: "15 7 */2 * *"
  workflow_dispatch:

concurrency:
  group: sauvegarde-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier la configuration
        id: config
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL absent — aucune sauvegarde effectuée."
            echo "dump=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "dump=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------- garde-veille
      # Une requête REST suffit à réarmer le compteur d'inactivité (7 jours).
      # On passe par l'API publique : plus simple qu'un client psql, et cela
      # teste au passage que l'application répond.
      - name: Garde-veille (sonde non garantie contre la mise en pause)
        if: always()
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY absents — garde-veille ignoré."
            exit 0
          fi
          # /auth/v1/health est public, sans jeton, et réveille PostgREST.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/auth/v1/health")
          echo "Santé Supabase : HTTP $code"
          # Une table RLS refusée renvoie 401/403 : c'est une requête valide
          # du point de vue de l'activité, le projet n'est donc pas en pause.
          code2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/articles?select=id&limit=1")
          echo "PostgREST : HTTP $code2 (401 attendu : anon ne lit rien, par conception)"
          if [ "$code" -ge 500 ] 2>/dev/null; then
            echo "::error::Le projet ne répond pas (HTTP $code). Vérifier s'il est en pause."
            exit 1
          fi

      # --------------------------------------------------------- pg_dump
      - name: Copie partielle chiffrée
        id: backup
        if: steps.config.outputs.dump == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_PASSPHRASE absent ou trop court — aucune sauvegarde."
            exit 1
          fi
          umask 077
          tmpdir=$(mktemp -d "${RUNNER_TEMP}/patsygest-backup-XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          horodatage=$(date -u +%Y-%m-%dT%H%M%SZ)
          fichier="patisgest-$horodatage.dump.gz.enc"
          # -Fc : format personnalisé, restaurable table par table.
          pg_dump --no-owner --no-privileges -Fc -f "$tmpdir/dump.pgc" "$DB_URL"
          gzip -9 "$tmpdir/dump.pgc"
          # AES-256 : le fichier contient des salaires, des tickets et des
          # recettes. Un stockage objet n'est pas un coffre-fort.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$tmpdir/dump.pgc.gz" -out "$fichier" -pass env:PASSPHRASE
          taille=$(stat -c %s "$fichier" | numfmt --to=iec)
          echo "Sauvegarde : $fichier ($taille)"
          # Contrôle d'intégrité minimal : le déchiffrement doit réussir.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$fichier" -out "$tmpdir/verif.gz" -pass env:PASSPHRASE
          gzip -t "$tmpdir/verif.gz"
          echo "Déchiffrement et gzip vérifiés ; ceci ne certifie pas une restauration ni une intégrité authentifiée."
          echo "FICHIER=$fichier" >> "$GITHUB_ENV"

      - name: Conserver la sauvegarde (artefact GitHub, 30 jours)
        if: steps.config.outputs.dump == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: ${{ env.FICHIER }}
          retention-days: 30
          if-no-files-found: error

      - name: Copier hors de GitHub (Cloudflare R2)
        if: steps.config.outputs.dump == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::notice::R2 non configuré — la sauvegarde reste en artefact GitHub."
            exit 0
          fi
          pipx install awscli >/dev/null 2>&1 || pip install --quiet awscli
          aws s3 cp "$FICHIER" "s3://$R2_BUCKET/sauvegardes/$FICHIER" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Copie R2 terminée."

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Copie partielle PâtisGest — restauration non certifiée"
            echo ""
            echo "- Étape de sonde : ${{ steps.health.outcome }} (les secrets peuvent manquer)."
            echo "- Copie partielle : ${{ steps.backup.outcome }}."
            echo "- ACL, rôles, propriétaires, services et fichiers Storage non couverts."
            echo "- Restauration réelle non testée par ce workflow."
            echo ""
            echo "**Essai limité**, uniquement sur une base de test isolée, non sur le pilote :"
            echo '```'
            echo 'openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in <fichier> -out d.gz -pass env:BACKUP_PASSPHRASE'
            echo 'gunzip -c d.gz > d.pgc && pg_restore --no-owner -d "<base de test>" d.pgc'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
