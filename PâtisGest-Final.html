<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PâtisGest — Logiciel de gestion pâtisserie (Version Finale)</title>
<meta name="description" content="PâtisGest : gestion complète pour pâtisserie — stocks FEFO, recettes, production, ventes, clôture, HACCP, cake design. Version finale fusionnée, 100% autonome.">
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;
  --brand:#7c3aed;--brand2:#4f46e5;--brandink:#fff;
  --ok:#067647;--okbg:#dcfae6;--warn:#b54708;--warnbg:#fef0c7;--bad:#b42318;--badbg:#fee4e2;--info:#175cd3;--infobg:#e0eaff;
  --r:14px;--sh:0 4px 18px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:#131022;color:#e6e3f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand .logo span{color:#c4b5fd}
.brand small{color:#a89fc9;font-size:12px}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:#cfc9ea;text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:10px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8b84ad;margin:12px 6px 4px;font-weight:700}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#a89fc9}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.alertpill{position:relative;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.alertpill b{background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
.content{padding:22px;max-width:1280px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16.5px}
.card h3{margin:0 0 8px;font-size:14.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;border-top:4px solid var(--kc,var(--brand))}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:800;margin:2px 0}
.kpi .s{font-size:12.5px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafbff}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok)}.bd.warn{background:var(--warnbg);color:var(--warn)}
.bd.bad{background:var(--badbg);color:var(--bad)}.bd.info{background:var(--infobg);color:var(--info)}
.bd.grey{background:#eef1f6;color:#475467}.bd.violet{background:#ede9fe;color:#6d28d9}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:#f2f4f7}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:#fef3f2;border-color:#fecdca;color:var(--bad)}
.btn.ok{background:#ecfdf3;border-color:#a6f4c5;color:var(--ok)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.inp,select.inp,textarea.inp{border:1px solid #cfd4dc;border-radius:10px;padding:8px 11px;font-size:13.5px;background:#fff;color:var(--ink);width:100%;font-family:inherit}
.inp:focus{outline:2px solid #c4b5fd;border-color:var(--brand)}
textarea.inp{min-height:70px;resize:vertical}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:#344054}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.row{display:grid;gap:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:760px){.r2,.r3,.r4{grid-template-columns:1fr}}
.ovl{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal.wide{max-width:920px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#f9fafb}
.xbtn{border:none;background:#eef1f6;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;font-weight:800}
.toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,90vw)}
.toast{background:#101828;color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:5px solid var(--brand);animation:tin .25s ease}
.toast.ok{border-color:#12b76a}.toast.warn{border-color:#f79009}.toast.bad{border-color:#f04438}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.callout{border-radius:12px;padding:12px 15px;font-size:13.5px;margin:10px 0;border:1px solid}
.callout.warn{background:#fffaeb;border-color:#fedf89;color:#7a2e0e}
.callout.info{background:#eff8ff;border-color:#b2ddff;color:#1849a9}
.callout.bad{background:#fef3f2;border-color:#fecdca;color:#7a271a}
.callout.ok{background:#ecfdf3;border-color:#a6f4c5;color:#05603a}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.tab.on{border-color:var(--brand);color:var(--brand);background:#f5f1ff}
.prog{height:9px;background:#eef1f6;border-radius:99px;overflow:hidden;min-width:80px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}
.list-plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list-plain li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.etiquette{border:2px dashed #98a2b3;border-radius:12px;padding:16px;max-width:420px;background:#fff}
.etiquette h4{margin:0 0 6px;font-size:17px}
.etiquette .alg{font-weight:800;text-decoration:underline}
.ticket{font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;max-width:340px;font-size:12.5px}
.ticket hr{border:none;border-top:1px dashed #98a2b3}
footer.appfoot{padding:18px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:960px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static}
  .nav{flex-direction:row;overflow-x:auto;padding:8px}
  .nav a{flex:0 0 auto}.nav .sec{display:none}
  .side .foot,.brand small{display:none}
  .content{padding:14px}
  .top h1{font-size:15px}
}
@media print{
  .side,.top,.no-print,.toasts,.ovl,footer.appfoot{display:none!important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">🧁 Pâtis<span>Gest</span></div><small>Version finale fusionnée · v1.0</small></div>

  </div>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";

   PâtisGest v1.0 — Version FINALE fusionnée (issue de l'audit des 5 CDC)
   Fichier unique, 100% autonome : d'abord le SITE, puis le LOGICIEL.
   ===================================================================== */
const APP="PâtisGest", VER="1.0-finale", LSKEY="patisgest_v1";
const LEVELS={matiere:"Matière première",semifini:"Semi-fini",produit:"Produit fini",emballage:"Emballage",consommable:"Consommable"};
const UNITS=["kg","g","L","ml","pcs"];
const TVA_CHOICES=[0,5.5,7,9,10,19,20];
const ALLERGENES=[["gluten","Gluten"],["crustaces","Crustacés"],["oeufs","Œufs"],["poissons","Poissons"],["arachides","Arachides"],["soja","Soja"],["lait","Lait (lactose)"],["fruits_coque","Fruits à coque"],["celeri","Céleri"],["moutarde","Moutarde"],["sesame","Graines de sésame"],["sulfites","Sulfites"],["lupin","Lupin"],["mollusques","Mollusques"]];
const FLUX=[["produit","Fabriqué"],["vendu","Vendu"],["reporte","Reporté (invendu réutilisable)"],["jete","Jeté"],["casse","Casse / erreur"],["offert","Offert / don / personnel"]];

/* ---------------- OUTILS ---------------- */
function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function uid(p){return (p||"id")+"-"+Date.now().toString(36)+"-"+Math.floor(Math.random()*1e6).toString(36)}
function pad2(n){return String(n).padStart(2,"0")}
function dISO(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function today(off){const d=new Date();if(off)d.setDate(d.getDate()+off);return dISO(d)}
function nowDT(){return new Date().toISOString()}
function fmtD(iso){if(!iso)return"—";const p=String(iso).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso}
function fmtDT(iso){if(!iso)return"—";const d=new Date(iso);return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())}
function daysBetween(a,b){const d1=new Date(a+"T00:00:00"),d2=new Date(b+"T00:00:00");return Math.round((d2-d1)/864e5)}
function num(v){const n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n}
function fmtN(n,d){if(n==null||isNaN(n))n=0;const dec=(d==null?2:d);return new Intl.NumberFormat("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n)}
function fmtQ(n,u){return fmtN(n,(u==="pcs"?0:3))+" "+(u||"")}
function M(n){return fmtN(n)+" "+(DB?DB.settings.deviseSym:"DA")}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function sum(arr,fn){return arr.reduce((t,x)=>t+(fn?fn(x):x),0)}
function groupBy(arr,fn){const o={};arr.forEach(x=>{const k=fn(x);(o[k]=o[k]||[]).push(x)});return o}
function download(nom,contenu,mime){const b=new Blob([contenu],{type:mime||"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvCell(v){v=String(v==null?"":v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return "﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n")}

}
/* Lots initiaux : [article, qté, PU, DLC(J+n), site, fournisseur] */
function seedLots(){
  const L=[["MP-FAR",50,120,180,"S1","F1"],["MP-SUC",30,115,120,"S1","F1"],["MP-SUG",10,220,180,"S1","F1"],

/* ---------------- ACCÈS ---------------- */
function S(){return DB.settings}
function article(id){return DB.articles.find(a=>a.id===id)||{id,nom:"(article supprimé)",code:"?",niveau:"matiere",unite:"",seuil:0,pvHT:0,tva:S().tvaDefaut}}
function lot(id){return DB.lots.find(l=>l.id===id)}

function site(id){return DB.sites.find(s=>s.id===id)||{nom:"—"}}
function famille(id){return DB.familles.find(f=>f.id===id)||{nom:"—"}}
function version(id){return DB.versions.find(v=>v.id===id)}
function activeVersion(famId){return DB.versions.filter(v=>v.familleId===famId).find(v=>v.active)||DB.versions.filter(v=>v.familleId===famId).slice(-1)[0]}
function of(id){return DB.ofs.find(o=>o.id===id)}

function lotStatut(l){if(!l)return["—","grey"];if(l.bloque)return["Bloqué","bad"];if(l.qtyRestante<0)return["Négatif","bad"];if(l.qtyRestante<=0.0001)return["Épuisé","grey"];if(l.dlc&&l.dlc<today())return["Périmé","bad"];return["Disponible","ok"]}
/* ---------------- STOCK & LOTS (FEFO) ---------------- */
function lotsOf(aid,siteId){return DB.lots.filter(l=>l.articleId===aid&&(!siteId||l.siteId===siteId))}
function stockOf(aid,siteId){return sum(lotsOf(aid,siteId),l=>l.qtyRestante)}
function cumpOf(aid){const ls=lotsOf(aid).filter(l=>l.qtyInitiale>0&&l.pu>0);const q=sum(ls,l=>l.qtyInitiale);return q>0?sum(ls,l=>l.qtyInitiale*l.pu)/q:0}
function lastPrice(aid){const hs=DB.prixHisto.filter(h=>h.articleId===aid).sort((a,b)=>a.date<b.date?1:-1);if(hs.length)return hs[0].pu;const ls=lotsOf(aid).filter(l=>l.pu>0).sort((a,b)=>a.date<b.date?1:-1);return ls.length?ls[0].pu:0}
function dlcMin(aid,siteId){const ls=lotsOf(aid,siteId).filter(l=>l.qtyRestante>0.0001&&l.dlc);if(!ls.length)return"";return ls.map(l=>l.dlc).sort()[0]}
function lotsFEFO(aid,siteId){return lotsOf(aid,siteId).filter(l=>!l.bloque&&l.qtyRestante>0.0001).sort((a,b)=>{
  if(a.congele!==b.congele)return a.congele?1:-1;
  if(!a.dlc&&!b.dlc)return a.date<b.date?-1:1; if(!a.dlc)return 1; if(!b.dlc)return -1;
  return a.dlc<b.dlc?-1:(a.dlc>b.dlc?1:0)})}
function addMouvement(m){m.id=m.id||uid("mvt");m.date=m.date||today();m.dt=m.dt||nowDT();DB.mouvements.push(m);return m}
/* Création d'un lot (entrée stock). Règle : lot obligatoire, DLC recommandée. */
function newLot(o){

  const l={id:uid("lot"),numero:o.numero||("LOT-"+DB.compteurs.lot),articleId:o.articleId,qtyInitiale:o.qty,qtyRestante:o.qty,
    pu:o.pu||0,dlc:o.dlc||"",siteId:o.siteId||"S1",fournisseurId:o.fournisseurId||"",date:o.date||today(),ref:o.ref||"",congele:!!o.congele,bloque:false};
  DB.lots.push(l);
  addMouvement({articleId:l.articleId,lotId:l.id,type:"entree",qty:l.qtyInitiale,siteId:l.siteId,ref:l.ref||("Lot "+l.numero),motif:"",pu:l.pu,date:l.date});
  if(l.pu>0&&o.fournisseurId)DB.prixHisto.push({articleId:l.articleId,date:l.date,pu:l.pu,fournisseurId:o.fournisseurId});
  return l;
}
/* Consommation multi-lots en FEFO. JAMAIS de blocage : le manquant est alerté. */
function consumeFEFO(aid,qtyBesoin,siteId,ref){
  let reste=qtyBesoin;const details=[];
  lotsFEFO(aid,siteId).forEach(l=>{if(reste<=0.0001)return;const prend=Math.min(l.qtyRestante,reste);
    l.qtyRestante=Math.round((l.qtyRestante-prend)*10000)/10000;reste=Math.round((reste-prend)*10000)/10000;
    details.push({lotId:l.id,numero:l.numero,qty:prend,pu:l.pu});
    addMouvement({articleId:aid,lotId:l.id,type:"sortie",qty:-prend,siteId,ref:ref||"",motif:"",pu:l.pu})});
  let manquant=0;
  if(reste>0.0001){manquant=reste;
    addMouvement({articleId:aid,lotId:"",type:"ecart",qty:-reste,siteId,ref:(ref||"")+" — MANQUANT (alerte, non bloquant)",motif:"Stock insuffisant"})}
  return{details,manquant};
}
function enterStock(aid,qty,siteId,ref,pu,dlc,fournisseurId,congele){
  return newLot({articleId:aid,qty,pu:pu||0,dlc:dlc||"",siteId,fournisseurId:fournisseurId||"",date:today(),ref:ref||"Entrée"});
}
/* ---------------- COÛT DE REVIENT COMPLET (formules corrigées) ----------------
   - Parage/cuve : la CONSOMMATION augmente  → qté × (1 + parage%)
   - Cuisson : le RENDEMENT diminue          → rendement × (1 - cuisson%)
   - Coût/portion = coût total ÷ rendement net. Pas de TVA dans le coût. */
let PUM_GUARD=0;
function puMatiere(aid){
  const fefo=lotsFEFO(aid); if(fefo.length&&fefo[0].pu>0)return{pu:fefo[0].pu,src:"lot FEFO "+fefo[0].numero};
  const c=cumpOf(aid); if(c>0)return{pu:c,src:"CUMP (indicatif)"};
  const lp=lastPrice(aid); if(lp>0)return{pu:lp,src:"dernier prix"};
  if(PUM_GUARD<3){const f=DB.familles.find(x=>x.produitId===aid);
    if(f){const av=activeVersion(f.id);
      if(av){PUM_GUARD++;const cc=coutVersion(av.id);PUM_GUARD--;
        if(cc.coutPortion>0)return{pu:cc.coutPortion,src:"co\u00fbt recette "+f.nom+" v"+av.version}}}}
  return{pu:0,src:"prix inconnu"};
}
function coutVersion(vid,prof){
  prof=prof||0; if(prof>5)return{total:0,coutPortion:0,lignes:[],erreur:"Boucle de sous-recette détectée !"};
  const v=version(vid); if(!v)return{total:0,coutPortion:0,lignes:[],erreur:"Version introuvable"};
  const lignes=[];let matiere=0;
  v.ingredients.forEach(ing=>{
    const parage=(ing.parage||0)/100, qAjust=ing.q*(1+parage);
    if(ing.t==="r"){const sv=version(ing.id);
      if(!sv){lignes.push({label:"Sous-recette introuvable",qty:qAjust,unit:ing.u,pu:0,total:0});return}
      const sub=coutVersion(sv.id,prof+1);const tot=sub.coutPortion*qAjust;
      matiere+=tot;lignes.push({label:"↳ "+famille(sv.familleId).nom+" v"+sv.version+" (figée)",qty:qAjust,unit:ing.u,pu:sub.coutPortion,total:tot,sub:true});
    }else{const a=article(ing.id);const p=puMatiere(ing.id);const tot=p.pu*qAjust;
      matiere+=tot;lignes.push({label:a.nom+(parage>0?" (parage +"+ing.parage+"%)":""),qty:qAjust,unit:ing.u,pu:p.pu,total:tot,src:p.src});
    }});
  const mo=(v.moMin/60)*S().tauxHoraireMO*(1+S().chargesRate);
  const total=matiere+(v.emballage||0)+mo+(v.energie||0)+(v.fraisGeneraux||0);
  const rendementNet=v.rendement.qty*(1-(v.cuissonPertePct||0)/100);
  return{lignes,matiere,emballage:v.emballage||0,mo,energie:v.energie||0,fraisGeneraux:v.fraisGeneraux||0,total,rendementNet,cuisson:v.cuissonPertePct||0,
    coutPortion:rendementNet>0?total/rendementNet:0,rendementBrut:v.rendement.qty,unit:v.rendement.unit};
}
function margeVersion(vid){
  const v=version(vid);const c=coutVersion(vid);const f=famille(v.familleId);
  const a=f.produitId?article(f.produitId):null;const pv=a?a.pvHT:0;
  return{cout:c.coutPortion,pvHT:pv,marge:pv-c.coutPortion,taux:pv>0?(pv-c.coutPortion)/pv*100:0,coutTotal:c};

function besoinsVersion(vid,qtyVoulue){
  const v=version(vid);const f=v.rendement.qty>0?qtyVoulue/v.rendement.qty:0;
  return v.ingredients.map(ing=>({t:ing.t,id:ing.id,qty:ing.q*f*(1+(ing.parage||0)/100),unit:ing.u,nom:ing.t==="r"?famille(version(ing.id)?version(ing.id).familleId:"").nom+" (v"+(version(ing.id)?version(ing.id).version:"?")+")":article(ing.id).nom}));
}
function createOF(famId,verId,qty,siteId,datePrevue){
  DB.compteurs.of++;
  const v=version(verId);
  const snapshot=JSON.parse(JSON.stringify({version:v,cout:coutVersion(verId)})); // snapshot figé
  const o={id:uid("of"),numero:"OF-"+String(DB.compteurs.of).padStart(3,"0"),familleId:famId,versionId:verId,
    qtyPrevue:qty,qtyRealisee:0,siteId,datePrevue:datePrevue||today(),dateLancement:"",statut:"planifie",
    snapshot,besoins:besoinsVersion(verId,qty),consommations:[],manquants:[],lotsProduits:[],coutReel:0};
  DB.ofs.push(o);return o;
}
function lancerOF(id){
  const o=of(id);if(!o||o.statut!=="planifie")return o;
  o.consommations=[];o.manquants=[];let coutMat=0;
  o.besoins.forEach(b=>{
    if(b.t==="r"){ // sous-recette : on consomme le semi-fini via sa version figée
      const sv=version(b.id);const subArt=famille(sv.familleId).produitId;
      const r=consumeFEFO(subArt,b.qty,o.siteId,o.numero+" · "+b.nom);
      r.details.forEach(d=>{o.consommations.push({articleId:subArt,lotId:d.lotId,numero:d.numero,qty:d.qty,pu:d.pu});coutMat+=d.qty*d.pu});
      if(r.manquant>0)o.manquants.push({articleId:subArt,qty:r.manquant});
    }else{
      const r=consumeFEFO(b.id,b.qty,o.siteId,o.numero+" · "+b.nom);
      r.details.forEach(d=>{o.consommations.push({articleId:b.id,lotId:d.lotId,numero:d.numero,qty:d.qty,pu:d.pu});coutMat+=d.qty*d.pu});
      if(r.manquant>0)o.manquants.push({articleId:b.id,qty:r.manquant});
    }});
  o.coutMatieres=coutMat;o.statut="encours";o.dateLancement=today();save();return o;
}
function validerOF(id,qtyReal){
  const o=of(id);if(!o)return null;
  qtyReal=Math.min(qtyReal,o.qtyPrevue-o.qtyRealisee);if(qtyReal<=0)return o;
  const f=famille(o.familleId);
  const prorata=o.qtyPrevue>0?qtyReal/o.qtyPrevue:0;
  const v=o.snapshot.version;
  const coutSup=(o.coutMatieres||0)*prorata+((v.emballage||0)+(v.energie||0)+(v.fraisGeneraux||0))*prorata+((v.moMin/60)*S().tauxHoraireMO*(1+S().chargesRate))*prorata;
  o.coutReel=(o.coutReel||0)+coutSup;
  const lotP=enterStock(f.produitId,qtyReal,o.siteId,o.numero+" · production",o.qtyPrevue>0?o.coutReel/(o.qtyRealisee+qtyReal):0,today(2),"",false);
  o.lotsProduits.push(lotP.id);o.qtyRealisee+=qtyReal;
  o.statut=o.qtyRealisee>=o.qtyPrevue-0.0001?"termine":"partiel";
  save();return o;
}

function encaisser(siteId,lignes,date,source,silencieux){
  DB.compteurs.vente++;DB.compteurs.ticket++;
  const v={id:uid("vente"),numero:"V-"+DB.compteurs.vente,ticket:"T-"+DB.compteurs.ticket,date:date||today(),dt:nowDT(),siteId,source:source||"caisse",lignes:[],manquants:[]};
  lignes.forEach(l=>{const a=article(l.articleId);
    const r=a.niveau==="produit"?consumeFEFO(l.articleId,l.qty,siteId,"Vente "+v.ticket):{details:[],manquant:0};
    v.lignes.push({articleId:l.articleId,qty:l.qty,puHT:l.puHT,tva:(l.tva==null?a.tva:l.tva),lots:r.details.map(d=>d.numero).join(", ")});
    if(r.manquant>0)v.manquants.push({articleId:l.articleId,qty:r.manquant})});
  v.totalHT=sum(v.lignes,l=>l.qty*l.puHT);v.totalTTC=sum(v.lignes,l=>l.qty*l.puHT*(1+l.tva/100));
  DB.ventes.push(v);if(!silencieux)save();return v;
}
function validerZ(date,siteId,lignes,caisse,silencieux){
  const mappees=lignes.map(l=>{const a=DB.articles.find(x=>x.code===l.code||x.id===l.code);return{articleId:a?a.id:l.code,qty:l.qty,puHT:l.pu,tva:a?a.tva:S().tvaDefaut,ok:!!a}});
  const totalHT=sum(mappees,l=>l.qty*l.puHT);
  const doublon=DB.importsZ.some(z=>z.date===date&&z.siteId===siteId&&Math.abs(z.totalHT-totalHT)<0.01);
  const z={id:uid("z"),date,siteId,caisse:caisse||"CAISSE-01",lignes:mappees,totalHT,doublon:!!doublon,venteId:""};
  if(!doublon){const v=encaisser(siteId,mappees.filter(l=>l.ok),date,"z-import",true);z.venteId=v.id}
  DB.importsZ.push(z);if(!silencieux)save();return z;
}

function clotureStats(cl){
  let produit=0,vendu=0,jete=0,casse=0,manque=0,caHT=0;

function getAlertes(){

    if(!l.dlc)al.push({niv:"warn",txt:"Lot "+l.numero+" ("+article(l.articleId).nom+") sans DLC",vue:"articles"});

      else if(j<=J)al.push({niv:"warn",txt:"DLC proche : "+l.numero+" ("+article(l.articleId).nom+") — J-"+j+" ("+fmtD(l.dlc)+")",vue:"articles"})}});
  DB.lots.filter(l=>l.qtyRestante<-0.0001).forEach(l=>al.push({niv:"bad",txt:"Stock négatif : "+l.numero+" ("+article(l.articleId).nom+")",vue:"articles"}));
  DB.articles.forEach(a=>{const s=stockOf(a.id);if(a.seuil>0&&s<=a.seuil)al.push({niv:s<=0?"bad":"warn",txt:"Stock bas : "+a.nom+" — reste "+fmtQ(s,a.unite)+" (seuil "+fmtQ(a.seuil,a.unite)+")",vue:"articles"})});
  DB.mouvements.filter(m=>m.type==="ecart").slice(-8).forEach(m=>al.push({niv:"warn",txt:"Manquant non bloquant : "+article(m.articleId).nom+" ("+fmtN(Math.abs(m.qty))+") — "+m.ref,vue:"dashboard"}));
  DB.temps.forEach(t=>{const f=frigo(t.frigoId);if(t.temp>f.seuilMax)al.push({niv:"bad",txt:"Température non conforme : "+f.nom+" à "+t.temp+"°C le "+fmtD(t.date)+" (max "+f.seuilMax+"°C)",vue:"haccp"})});
  DB.ncs.filter(n=>n.statut!=="Clôturée").forEach(n=>al.push({niv:"warn",txt:"Non-conformité ouverte : "+n.type+" — "+n.description,vue:"haccp"}));
  DB.cakes.filter(c=>c.statut==="devis"&&daysBetween(today(),c.dateEvent)<=3&&daysBetween(today(),c.dateEvent)>=0).forEach(c=>al.push({niv:"warn",txt:"Devis "+c.numero+" ("+c.client+") sans acompte, événement dans "+daysBetween(today(),c.dateEvent)+" j",vue:"cake"}));
  return al;
}
/* Garde-fous de saisie : ×10/÷10 et prix > 2× la référence. Alerte, jamais blocage. */
function guardCheck(valeur,reference,libelle){
  if(!reference||reference<=0||!valeur||valeur<=0)return"";
  const r=valeur/reference;
  if(r>=10||r<=0.1)return"⚠ "+libelle+" : valeur ×"+fmtN(r,1)+" par rapport à la référence ("+fmtN(reference)+" — "+fmtN(valeur)+"). Vérifiez la saisie (non bloquant).";
  if(r>=2||r<=0.5)return"⚠ "+libelle+" : écart important vs référence ("+fmtN(reference)+" → "+fmtN(valeur)+"). Vérifiez (non bloquant).";
  return"";
}

  let h='<div class="grid g4">'+kpi("Prévu",fmtN(o.qtyPrevue,0),"le "+fmtD(o.datePrevue),"#7c3aed")+kpi("Réalisé",fmtN(o.qtyRealisee,0),OF_STATUTS[o.statut][0],"#2e90fa")+
    kpi("Coût prévu",M(coutPrev),M(o.snapshot.cout.coutPortion)+" / portion","#f79009")+kpi("Coût réel",M(o.coutReel||0),o.qtyRealisee?M(o.coutReel/o.qtyRealisee)+" / pièce":"—","#12b76a")+"</div>";
  h+="<h3>Besoins (snapshot figé au lancement)</h3>"+tbl([["Ingrédient"],["Besoin","num"],["Consommé (lots)","num"]],
    o.besoins.map(b=>{const con=o.consommations.filter(c=>(b.t==="r"?famille(version(b.id).familleId).produitId===c.articleId:b.id===c.articleId));

/* ================= VUE : ÉTIQUETTES & ALLERGÈNES ================= */
function allergenesOf(aid,prof){
  prof=prof||0;if(prof>4)return[];
  const direct=DB.allergenes[aid]||[];
  const f=DB.familles.find(x=>x.produitId===aid);
  if(!f)return direct;
  const av=activeVersion(f.id);if(!av)return direct;
  const set=new Set(direct);
  av.ingredients.forEach(ing=>{
    if(ing.t==="a"){(DB.allergenes[ing.id]||[]).forEach(a=>set.add(a))}
    else{const sv=version(ing.id);if(sv){const sub=famille(sv.familleId).produitId;allergenesOf(sub,prof+1).forEach(a=>set.add(a))}}});
  return Array.from(set);
}
function tracesOf(aid){
  const set=new Set(DB.traces[aid]||[]);
  const f=DB.familles.find(x=>x.produitId===aid);
  if(f){const av=activeVersion(f.id);if(av)av.ingredients.forEach(ing=>{if(ing.t==="a")(DB.traces[ing.id]||[]).forEach(t=>set.add(t))})}
  return Array.from(set);
}
function ingredientsINCO(aid){
  const f=DB.familles.find(x=>x.produitId===aid);if(!f)return[];
  const av=activeVersion(f.id);if(!av)return[];
  const items=av.ingredients.map(ing=>{
    if(ing.t==="a")return{nom:article(ing.id).nom,qty:ing.q,alg:DB.allergenes[ing.id]||[]};
    const sv=version(ing.id);return{nom:famille(sv.familleId).nom+" (sous-recette)",qty:ing.q,alg:allergenesOf(famille(sv.familleId).produitId)}});
  return items.sort((a,b)=>b.qty-a.qty); // ordre décroissant de poids (INCO)
}

function vSimulation(){
  const vers=DB.versions.filter(v=>v.active);
  if(!vers.find(v=>v.id===UI.simVer))UI.simVer=vers.length?vers[0].id:"";
  const v=version(UI.simVer);
  let corps='<div class="callout info">Créez d\'abord une recette.</div>';
  if(v){const f=famille(v.familleId),a=f.produitId?article(f.produitId):null;
    if(!UI.simPV&&a)UI.simPV=a.pvHT;
    const c=coutVersion(v.id);
    const coutSim=c.total*(1+UI.simMat/100), portionSim=c.rendementNet>0?coutSim/c.rendementNet:0;
    const marge=UI.simPV-portionSim, taux=UI.simPV>0?marge/UI.simPV*100:0;
    corps='<div class="grid g2"><div class="card"><h3>Hypothèses</h3>'+
      fld("Recette (version active)",'<select class="inp" onchange="UI.simVer=this.value;UI.simPV=0;render()">'+selOpts(vers.map(x=>[x.id,famille(x.familleId).nom]),UI.simVer)+"</select>")+
      fld("Prix de vente HT simulé : <b>"+M(UI.simPV)+"</b>",'<input type="range" min="0" max="'+Math.max(500,portionSim*5)+'" step="10" value="'+UI.simPV+'" style="width:100%" oninput="UI.simPV=num(this.value);render()">')+
      fld("Variation du coût matières : <b>"+(UI.simMat>=0?"+":"")+UI.simMat+" %</b>",'<input type="range" min="-30" max="100" step="1" value="'+UI.simMat+'" style="width:100%" oninput="UI.simMat=num(this.value);render()">')+
      '<p class="small muted">Coût de base : '+M(c.coutPortion)+' / '+c.unit+' → coût simulé : <b>'+M(portionSim)+'</b></p></div>'+
      '<div class="card"><h3>Résultat</h3><div class="grid g2">'+
      kpi("Marge / portion",M(marge),fmtN(taux,1)+" %",marge>=0?"#12b76a":"#f04438")+
      kpi("Coefficient",c.coutPortion>0?"× "+fmtN(UI.simPV/c.coutPortion,2):"—","PV ÷ coût","#7c3aed")+"</div>"+
      "<h3>Prix conseillés (coût simulé × coef)</h3>"+
      tbl([["Coef","num"],["Prix HT","num"],["Marge","num"]],[2.5,3,3.5].map(k=>["× "+k,M(portionSim*k),M(portionSim*k-portionSim)]))+"</div></div>";
  }
  // Impact hausse : article + nouveau prix
  return '<div class="card"><h2>🧮 Simulation de prix & marge</h2>'+corps+"</div>"+
    '<div class="card"><h2>💥 Impact d\'une hausse fournisseur</h2><div class="toolbar">'+
    '<select class="inp" id="simArt" style="max-width:260px">'+artOptions(["matiere"],UI.simArt||"MP-BEU")+'</select>'+
    '<input class="inp" id="simPrix" type="number" step="any" placeholder="Nouveau prix…" style="max-width:160px">'+
    '<button class="btn primary" onclick="impactHausse()">Calculer l\'impact</button></div><div id="impactBox"></div></div>';
}
function impactHausse(){
  const aid=document.getElementById("simArt").value,np=num(document.getElementById("simPrix").value);
  const recs=recettesImpactees(aid);
  if(!np||!recs.length){document.getElementById("impactBox").innerHTML='<div class="callout warn">Saisissez un prix et vérifiez que des recettes actives utilisent cet article.</div>';return}
  const ap=lastPrice(aid)||cumpOf(aid);
  const rows=recs.map(v=>{const c=coutVersion(v.id);let delta=0;
    v.ingredients.forEach(ing=>{if(ing.t==="a"&&ing.id===aid)delta+=(np-ap)*ing.q*(1+(ing.parage||0)/100)});
    const dp=c.rendementNet>0?delta/c.rendementNet:0;
    return ["<b>"+esc(famille(v.familleId).nom)+"</b>",M(c.coutPortion),M(c.coutPortion+dp),"<b>+"+M(dp)+"</b>"]});
  document.getElementById("impactBox").innerHTML='<div class="callout warn">Hausse '+esc(article(aid).nom)+' : '+M(ap)+' → '+M(np)+' ('+fmtN(ap?(np-ap)/ap*100:0,1)+' %). <b>'+recs.length+' recette(s) impactée(s)</b>.</div>'+
    tbl([["Recette"],["Coût actuel","num"],["Nouveau coût","num"],["Delta / portion","num"]],rows);
}

function restoreFile(input){

  r.readAsText(f);input.value="";
}

function exportVentes(){
  const rows=[["N°","Ticket","Date","Site","Source","Total HT","Total TTC"]];
  DB.ventes.forEach(v=>rows.push([v.numero,v.ticket,v.date,site(v.siteId).nom,v.source,v.totalHT,v.totalTTC]));
  download("patisgest-ventes.csv",toCSV(rows),"text/csv");toast("Export ventes téléchargé.","ok");
}
async function viderDemo(){if(await confirmDlg("Recharger le jeu de démonstration ? (vos données actuelles seront remplacées)","Recharger")){resetDemo();refresh();toast("Démo rechargée.","ok")}}
async function toutEffacer(){if(await confirmDlg("TOUT effacer et repartir de zéro (paramètres conservés) ?","Tout effacer")){const s=S();DB=seedDB();DB.settings=s;DB.familles=[];DB.versions=[];save();refresh();toast("Base vidée. Créez vos articles, puis vos recettes.","warn")}}

function vGuide(){
  return '<div class="card"><h2>❓ Guide — du site au logiciel</h2>'+
  "<h3>1 · Votre quotidien (dans l'ordre)</h3><ol class='small'><li><b>Achats</b> : fournisseurs + bons de commande, réceptionnez (lots + DLC).</li><li><b>Recettes</b> : vérifiez coûts et marges (formules corrigées de l'audit).</li><li><b>Production</b> : créez un OF, lancez (conso FEFO multi-lots), validez la quantité réelle.</li><li><b>Ventes</b> : encaissez au comptoir ou importez le ticket Z de caisse.</li><li><b>Clôture</b> : chaque soir, les 6 flux + taux de perte.</li><li><b>HACCP</b> : températures + nettoyage chaque jour.</li></ol>"+
  "<h3>2 · Règles d'or (issues de l'audit des 5 cahiers des charges)</h3><ul class='small'><li><b>Alerte, jamais blocage</b> : un manquant n'empêche jamais de vendre ou produire, il est signalé.</li><li><b>Lot obligatoire + FEFO</b> : DLC la plus proche d'abord, sur plusieurs lots si besoin.</li><li><b>Coût VRAI</b> : matière au lot + emballage + MO chargée + énergie + frais généraux. Pas de TVA.</li><li><b>Parage ↑ consommation, cuisson ↓ rendement.</b></li><li><b>Marge toujours sur HT.</b> Clôture en 6 flux, taux de perte = (jeté + casse) ÷ fabriqué.</li><li><b>Recettes versionnées</b> : les OF gardent un snapshot figé ; les sous-recettes pointent une version figée.</li></ul>"+
  "<h3>3 · Transformer ce site en logiciel (3 options)</h3><ol class='small'><li><b>Option A — Application bureau (recommandé)</b> : installez Node.js, puis dans le dossier <b>patisgest-desktop</b> (fourni avec ce fichier) lancez <b>npm install</b> puis <b>npm start</b>. Pour un installateur Windows : <b>npm run dist</b>. Votre fichier HTML devient un vrai logiciel avec icône.</li><li><b>Option B — Application mobile/tablette (PWA)</b> : hébergez ce fichier sur Netlify/Vercel (glisser-déposer gratuit), ouvrez-le sur la tablette du labo puis « Ajouter à l'écran d'accueil ». Fonctionne hors-ligne.</li><li><b>Option C — Vrai logiciel multi-utilisateur (V2)</b> : reprenez vos fichiers Next.js + PostgreSQL + Drizzle déjà prêts, et recréez chaque écran avec les mêmes règles de calcul (voir le tableau de correspondance dans le guide fourni).</li></ol>"+
  "<h3>4 · Sauvegarde</h3><p class='small'>Données stockées localement (hors-ligne). Téléchargez la sauvegarde JSON chaque semaine (bouton 💾 en haut). Gardez une copie sur clé USB.</p></div>"+
  '<div class="card"><h2>🗺️ Modules couverts (27 de l\'audit → 15 écrans)</h2>'+
  tbl([["Écran"],["Modules de l'audit couverts"]],
  [["🏠 Tableau de bord","Dashboard & rapports, pilotage"],["📦 Articles & Stocks","Structure 3 niveaux, lots & FEFO, stock & inventaire"],["🧾 Achats","Achats & fournisseurs, aide à la décision (hausses, recettes impactées)"],["📖 Recettes","Recettes & versionnage, coût de revient complet"],["👨‍🍳 Production","Ordres de fabrication (snapshot, FEFO, validation partielle)"],["💰 Ventes","Ventes & import Z, retours & avoirs"],["📊 Clôture","Clôture 6 flux & anti-gaspi"],["🎂 Cake Studio","Cake Design (configurateur, acompte bloquant, rétroplanning, CGV)"],["🌡️ HACCP","HACCP-lite, températures, nettoyage, non-conformités"],["🏷️ Étiquettes","Allergènes & INCO (ordre décroissant, DLC/DDM)"],["🔍 Traçabilité","Traçabilité amont/aval, rappel lot"],["📅 Planning","Planification, besoins, capacité"],["🧮 Simulation","Simulation prix, impact hausses"],["🏪 Sites","Multi-sites & transferts"],["💾 Données","Exports, onboarding, sauvegarde"]])+"</div>";
}

let CUR="dashboard";
function go(id){if(location.hash==="#"+id)render();else location.hash="#"+id}
function renderNav(){
  document.getElementById("nav").innerHTML=VIEWS.map(v=>v.sec?'<div class="sec">'+v.sec+"</div>":'<a href="#'+v.id+'" class="'+(CUR===v.id?"on":"")+'">'+v.ico+" "+v.label+"</a>").join("");
}
function render(){
  CUR=(location.hash||"#dashboard").slice(1);
  if(!VIEWS.find(v=>v.id===CUR))CUR="dashboard";
  const v=VIEWS.find(x=>x.id===CUR);
  document.getElementById("viewTitle").textContent=v.ico+" "+v.label;
  document.getElementById("topDate").textContent=fmtD(today())+" · "+S().labName;
  document.getElementById("footLab").textContent=S().labName;
  try{document.getElementById("content").innerHTML=v.fn()}catch(e){
    document.getElementById("content").innerHTML='<div class="callout bad"><b>Erreur d\'affichage :</b> '+esc(e.message)+"<br><span class='tiny'>Essayez de recharger la page. Si le problème persiste, restaurez une sauvegarde JSON.</span></div>";
    console.error(e);
  }
  renderNav();majAlertes();window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
/* ================= DÉMARRAGE ================= */
(function init(){
  DB=load();
  if(!DB||!DB.settings){DB=seedDB();seedLots();seedRecettes();seedMouvements();save();

  }
  render();
})();
